<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartilhas</title>
    <meta name="description" content="Poemas, crônicas, contos e ensaios." />

    <!-- Preview ao compartilhar um link (WhatsApp, Telegram, Twitter/X,
         Discord...) - estático, não por rota: o app é uma SPA e esses
         crawlers não executam JS, então todo link compartilhado mostra o
         mesmo cartão (o hero da própria marca), não um resumo por texto
         (ver tools/og-image.html pra regenerar as imagens). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cartilhas" />
    <meta property="og:title" content="Cartilhas" />
    <meta property="og:description" content="Poemas, crônicas, contos e ensaios." />
    <meta property="og:url" content="https://cartilhas.eleotherium.com/" />
    <meta property="og:image" content="https://cartilhas.eleotherium.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Segunda imagem (quadrada) - alguns apps de mensagem (WhatsApp,
         Telegram em certos contextos) recortam a 1200x630 de forma feia no
         card pequeno; o OG permite múltiplas tags `og:image`, o cliente
         escolhe a que preferir. -->
    <meta property="og:image" content="https://cartilhas.eleotherium.com/og-image-square.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cartilhas" />
    <meta name="twitter:description" content="Poemas, crônicas, contos e ensaios." />
    <meta name="twitter:image" content="https://cartilhas.eleotherium.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
